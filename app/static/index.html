<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MockTest Maker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         background: #f4f5f7; color: #1c1e21; line-height: 1.55; }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  header.top { background: #2b3a4a; color: #fff; padding: 18px 0; }
  header.top .container { padding: 0 16px; }
  header.top h1 { font-size: 20px; }
  header.top p { font-size: 13px; opacity: .75; }
  .card { background: #fff; border-radius: 12px; padding: 20px 22px; margin-top: 16px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card.compact { padding: 12px 18px; margin-top: 10px; }
  .gen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  @media (max-width: 720px) { .gen-grid { grid-template-columns: 1fr; } }
  .section-title { margin-top: 20px; font-size: 16px; color: #334; }
  .leave-warn { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #b02929;
                color: #fff; text-align: center; padding: 12px; font-weight: 700; display: none; }
  .test-item { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .test-item:hover { border-color: #2b3a4a; }
  .test-item h3 { font-size: 16px; }
  .test-item .meta { font-size: 13px; color: #666; margin-top: 4px; }
  .btn { background: #2b6cb0; color: #fff; border: none; border-radius: 8px;
         padding: 9px 18px; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #245a94; }
  .btn.secondary { background: #e2e8f0; color: #2d3748; }
  .qhead { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .qnum { font-weight: 700; font-size: 16px; }
  .badge { font-size: 11.5px; background: #eef2f7; color: #4a5568; border-radius: 20px;
           padding: 3px 10px; }
  .diff { font-size: 11.5px; border-radius: 20px; padding: 3px 10px; }
  .diff.easy { background: #e6f6e6; color: #237a23; }
  .diff.mid  { background: #fff4db; color: #976d00; }
  .diff.hard { background: #fde4e4; color: #b02929; }
  .qtext { margin: 10px 0 12px; font-size: 15.5px; }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice { display: flex; gap: 10px; align-items: baseline; border: 1.5px solid #dde3ea;
            border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 15px; background: #fff; }
  .choice:hover { border-color: #2b6cb0; }
  .choice.selected { border-color: #2b6cb0; background: #ebf3fb; }
  .choice.correct { border-color: #2f9e44; background: #e6f6e6; }
  .choice.wrong { border-color: #e03131; background: #fde4e4; }
  .choice .letter { font-weight: 700; min-width: 18px; }
  .int-input { font-size: 16px; padding: 8px 12px; border: 1.5px solid #dde3ea; border-radius: 8px;
               width: 140px; font-variant-numeric: tabular-nums; }
  .int-input.correct { border-color: #2f9e44; background: #e6f6e6; }
  .int-input.wrong { border-color: #e03131; background: #fde4e4; }
  .solution { margin-top: 12px; padding: 12px 14px; background: #f8fafc; border-left: 3px solid #2b6cb0;
              border-radius: 6px; font-size: 14.5px; display: none; }
  .submitted .solution { display: block; }
  .sticky-bar { position: sticky; top: 0; z-index: 10; background: #fff; border-radius: 12px;
                padding: 12px 18px; margin-top: 16px; display: flex; justify-content: space-between;
                align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; }
  .timer.low { color: #e03131; }
  .progress { font-size: 13px; color: #666; }
  .score { font-size: 22px; font-weight: 800; }
  .hidden { display: none; }
  .tabs { display: flex; gap: 4px; background: #1f2c3a; padding: 0 16px; }
  .tabs .container { display: flex; gap: 4px; padding: 0; }
  .tab { padding: 10px 18px; color: #b8c4d0; cursor: pointer; font-size: 14px;
         border-bottom: 3px solid transparent; }
  .lang-toggle { margin-left: auto; display: flex; border: 1px solid #4a5a6a; border-radius: 6px; overflow: hidden; }
  .lang-toggle span { padding: 6px 12px; cursor: pointer; font-size: 13px; color: #b8c4d0; }
  .lang-toggle span.on { background: #2b6cb0; color: #fff; }
  .tab:hover { color: #fff; }
  .tab.active { color: #fff; border-bottom-color: #5ea3f7; font-weight: 600; }
  table.stats { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.stats th, table.stats td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
  table.stats th { color: #666; font-weight: 600; font-size: 12.5px; }
  .pct-bar { background: #e2e8f0; border-radius: 4px; height: 8px; width: 120px; display: inline-block; vertical-align: middle; }
  .pct-bar > div { background: #2b6cb0; height: 8px; border-radius: 4px; }
  .saved-note { color: #237a23; font-size: 13px; margin-left: 10px; }
</style>
</head>
<body>
<header class="top"><div class="container">
  <h1>📝 MockTest Maker</h1>
  <p>Mock exams built from real competition 真题 — numbers modified, difficulty preserved</p>
</div></header>
<nav class="tabs"><div class="container">
  <div class="tab active" data-tab="new" onclick="showTab('new')" id="tabNew">🎲 New Test</div>
  <div class="tab" data-tab="tests" onclick="showTab('tests')" id="tabTests">📋 My Tests <span id="testCount"></span></div>
  <div class="tab" data-tab="stats" onclick="showTab('stats')" id="tabStats">📊 Stats</div>
  <div class="lang-toggle"><span id="langEN" onclick="setLang('en')">EN</span><span id="langZH" onclick="setLang('zh')">中文</span></div>
</div></nav>
<div class="leave-warn" id="leaveWarn">⚠ You left the test! It will close in <span id="leaveCount">30</span>s — come back now to keep it.</div>
<div class="container" id="app">Loading…</div>

<script>
const app = document.getElementById('app');
const I18N = {
  en: {
    tabNew: '🎲 New Test', tabTests: '📋 My Tests', tabStats: '📊 Stats',
    tests: 'tests', problems: 'real problems', problemsModified: 'real problems with various modified questions',
    questions: 'questions', minutes: 'minutes', min: 'min',
    backAll: '‹ Back to all competitions', back: '‹ Back to',
    category: 'Category', timeLimit: 'Time limit', bank: 'Problem bank',
    content: 'Content', generate: 'Generate →', start: 'Start →', retake: 'Retake →',
    currentTests: '📄 Current Tests', pastTests: '📝 Past Tests',
    noTests: 'No tests yet — generate one from the New Test tab.',
    noAttempts: 'No attempts yet.',
    submitted: 'submitted', answered: 'answered', proof: 'proof',
    problem: 'Problem', easy: 'Easy', medium: 'Medium', hard: 'Hard',
    modifiedFrom: 'Modified from', realProblem: 'Real problem ·',
    showSolution: 'Show solution', answer: 'Answer', noSolution: 'No solution available yet — see the source link on AoPS.',
    submit: 'Submit', exit: 'Exit', score: 'Score', solutionsRevealed: 'Solutions revealed',
    savedOk: '✓ saved to My Tests', savedFail: '⚠ save failed',
    testsTaken: 'tests taken', questionsAnswered: 'questions answered', averageScore: 'average score',
    byCompetition: 'By competition', competition: 'Competition', attempts: 'Attempts', average: 'Average', best: 'Best',
    leaveWarn1: '⚠ You left the test! It will close in', leaveWarn2: 's — click here to go back to your test.',
    closedWarn: '⚠ Test closed because you were away for 30 seconds. Your answers were discarded.',
    disclaimer: '<b>Disclaimer:</b> For <b>AMC 8, AMC 10, AMC 12, AIME, and Math Kangaroo</b>, we use <b>modified questions</b> — real problems with numbers changed and answers recomputed (marked <i>Modified from …</i>). For <b>all other competitions</b>, mock tests use the <b>original official past problems</b> (marked <i>Real problem · …</i>), which their organizers publish free for practice.',
  },
  zh: {
    tabNew: '🎲 生成新试卷', tabTests: '📋 我的试卷', tabStats: '📊 统计',
    tests: '套测试', problems: '道真题', problemsModified: '道真题（含改编题）',
    questions: '题', minutes: '分钟', min: '分钟',
    backAll: '‹ 返回全部竞赛', back: '‹ 返回',
    category: '科目类别', timeLimit: '时间限制', bank: '题库',
    content: '内容', generate: '生成 →', start: '开始 →', retake: '重做 →',
    currentTests: '📄 当前试卷', pastTests: '📝 历史试卷',
    noTests: '还没有试卷 — 去“生成新试卷”页生成一套吧。',
    noAttempts: '还没有答题记录。',
    submitted: '提交于', answered: '已作答', proof: '证明题',
    problem: '第', easy: '简单', medium: '中等', hard: '困难',
    modifiedFrom: '改编自', realProblem: '真题 ·',
    showSolution: '显示解答', answer: '答案', noSolution: '暂无解答 — 请查看 AoPS 源链接。',
    submit: '提交', exit: '退出', score: '得分', solutionsRevealed: '已显示解答',
    savedOk: '✓ 已保存到“我的试卷”', savedFail: '⚠ 保存失败',
    testsTaken: '已测套数', questionsAnswered: '已答题数', averageScore: '平均得分',
    byCompetition: '按竞赛统计', competition: '竞赛', attempts: '次数', average: '平均分', best: '最高分',
    leaveWarn1: '⚠ 你离开了试卷！将在', leaveWarn2: '秒后关闭 — 点此返回试卷。',
    closedWarn: '⚠ 试卷已关闭：你离开了 30 秒，作答已被丢弃。',
    disclaimer: '<b>声明：</b>对于 <b>AMC 8、AMC 10、AMC 12、AIME 和袋鼠数学</b>，我们使用<b>改编题</b> — 修改数字并重算答案的真题（标记为 <i>Modified from …</i>）。对于<b>其他所有竞赛</b>，模拟卷使用<b>官方原始真题</b>（标记为 <i>Real problem · …</i>），这些真题由主办方免费公开发布。',
  },
};
let LANG = localStorage.getItem('mt_lang') || 'en';
const t = k => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;

function setLang(l) {
  LANG = l;
  localStorage.setItem('mt_lang', l);
  document.getElementById('langEN').classList.toggle('on', l === 'en');
  document.getElementById('langZH').classList.toggle('on', l === 'zh');
  document.getElementById('tabNew').innerHTML = t('tabNew');
  document.getElementById('tabTests').innerHTML = t('tabTests') + ' <span id="testCount"></span>';
  document.getElementById('tabStats').innerHTML = t('tabStats');
  // re-render current view
  if (state.test && document.querySelector('.sticky-bar')) {
    renderTest();
    for (const [n, v] of Object.entries(state.answers)) {
      const c = document.querySelector(`.choice[data-q="${n}"][data-l="${v}"]`);
      if (c) c.classList.add('selected');
      const inp = document.getElementById('int' + n);
      if (inp) inp.value = v;
    }
    if (state.submitted) {
      // re-apply grading visuals is complex; simplest: re-submit visually
      document.querySelectorAll('.card.submitted').forEach(c => c.classList.remove('submitted'));
    }
  } else {
    doShowTab(state.tab || 'new');
  }
}
let state = { test: null, answers: {}, submitted: false, deadline: null, timerId: null, startedAt: null, tab: 'new' };

function showTab(tab) {
  // leaving an active test? navigate, but start the 30s close countdown
  if (state.test && !state.submitted && tab !== state.tab) {
    doShowTab(tab);
    startLeaveWatch(tab);
    return;
  }
  doShowTab(tab);
}

function doShowTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'new') home();
  else if (tab === 'tests') myTests();
  else if (tab === 'stats') stats();
}

function renderMath(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, { delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false},
    ]});
  }
}
function difficulty(n, total) {
  if (total <= 6) {  // olympiad day format (IMO): P1 easy, P2-4 medium, P5-6 hard
    if (n <= 1) return ['easy', t('easy')];
    if (n <= 4) return ['mid', t('medium')];
    return ['hard', t('hard')];
  }
  const r = n / total;
  if (r <= 0.4) return ['easy', t('easy')];
  if (r <= 0.75) return ['mid', t('medium')];
  return ['hard', t('hard')];
}
function fmtTime(s) {
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

async function home() {
  clearInterval(state.timerId);
  showFamilies();
}

async function showFamilies() {
  const banks = await (await fetch('/api/banks')).json();
  state.banks = banks;
  const catOrder = ['Math', 'Physics', 'Chemistry', 'Biology', 'Informatics', 'Astronomy & Earth', 'Economics', 'Linguistics', 'Other'];
  // group by category -> family
  const fams = {};
  for (const b of banks) {
    (fams[b.category] ??= {});
    (fams[b.category][b.family] ??= []).push(b);
  }
  let html = '';
  for (const cat of catOrder.filter(c => fams[c])) {
    html += `<h2 class="section-title">${catIcon(cat)} ${cat}</h2><div class="gen-grid">`;
    for (const [fam, subs] of Object.entries(fams[cat])) {
      const n_probs = subs.reduce((s, b) => s + b.total_variants, 0);
      html += `
      <div class="card compact test-item" onclick="showSubtests('${fam}')">
        <div>
          <h3>${fam}</h3>
          <div class="meta">${subs.length} ${t('tests')} · ${n_probs} ${t('problemsModified')}</div>
        </div>
        <button class="btn">›</button>
      </div>`;
    }
    html += '</div>';
  }
  html += '<div class="card compact" style="font-size:13px;color:#666;line-height:1.6">' + t('disclaimer') + '</div>';
  app.innerHTML = html;
}

function showSubtests(fam) {
  const subs = state.banks.filter(b => b.family === fam);
  const cat = subs[0]?.category || '';
  let html = `<div class="card compact" style="cursor:pointer" onclick="showFamilies()">${t('backAll')}</div>
    <h2 class="section-title">${catIcon(cat)} ${fam}</h2><div class="gen-grid">`;
  for (const b of subs) {
    html += `
    <div class="card compact test-item" onclick="showDetail('${b.slug}'${b.round ? `,'${b.round}'` : ''})">
      <div>
        <h3>${b.name}</h3>
        <div class="meta">${b.n_questions} ${t('questions')} · ${b.time_limit_min} ${t('min')} · ${b.total_variants} ${t('problems')}</div>
      </div>
      <button class="btn">›</button>
    </div>`;
  }
  html += '</div>';
  app.innerHTML = html;
}

function showDetail(slug, round) {
  const b = state.banks.find(x => x.slug === slug && x.round === (round || null));
  if (!b) return;
  const types = b.total_variants >= 300 ? t('realProblem') : t('modifiedFrom');
  app.innerHTML = `
    <div class="card compact" style="cursor:pointer" onclick="showSubtests('${b.family}')">${t('back')} ${b.family}</div>
    <div class="card">
      <h2>${b.name}</h2>
      <table class="stats" style="margin-top:12px">
        <tr><th>${t('category')}</th><td>${b.category}</td></tr>
        <tr><th>${t('questions')}</th><td>${b.n_questions}</td></tr>
        <tr><th>${t('timeLimit')}</th><td>${b.time_limit_min} ${t('minutes')}</td></tr>
        <tr><th>${t('bank')}</th><td>${b.total_variants} ${t('problemsModified')}</td></tr>
        <tr><th>${t('content')}</th><td>${types}</td></tr>
      </table>
      <div style="margin-top:18px;display:flex;gap:10px">
        <button class="btn" style="font-size:16px;padding:12px 28px" onclick="generate('${b.slug}'${b.round ? `,'${b.round}'` : ''})">${t('generate')}</button>
      </div>
    </div>`;
}

function catIcon(cat) {
  return {'Math': '📐', 'Physics': '🔭', 'Chemistry': '🧪', 'Biology': '🧬',
          'Informatics': '💻', 'Astronomy & Earth': '🌌', 'Economics': '💰',
          'Linguistics': '🗣️', 'Other': '📚'}[cat] || '📚';
}

async function generate(slug, round) {
  const r = await (await fetch(`/api/generate/${slug}${round ? '/' + encodeURIComponent(round) : ''}`)).json();
  if (r.ok) openTest(r.id); else alert(r.error || 'generation failed');
}

async function openTest(id) {
  const t = await (await fetch(`/api/test/${id}`)).json();
  state = { ...state, test: t, answers: {}, submitted: false,
            deadline: Date.now() + t.time_limit_min * 60000, timerId: null, startedAt: Date.now() };
  renderTest();
  state.timerId = setInterval(tick, 1000);
}

function tick() {
  const left = Math.max(0, Math.round((state.deadline - Date.now()) / 1000));
  const el = document.getElementById('timer');
  if (el) { el.textContent = '⏱ ' + fmtTime(left); el.classList.toggle('low', left < 300); }
  if (left === 0 && !state.submitted) submit();
}

function renderTest() {
  const tt = state.test;
  const total = tt.questions.length;
  app.innerHTML = `
    <div class="sticky-bar">
      <div>
        <div style="font-weight:700">${tt.title}</div>
        <div class="progress" id="progress">0 / ${total} ${t('answered')}</div>
      </div>
      <div style="display:flex;gap:14px;align-items:center">
        <span class="timer" id="timer">⏱ ${fmtTime(tt.time_limit_min*60)}</span>
        <button class="btn secondary" onclick="exitTest(false)">${t('exit')}</button>
        <button class="btn" onclick="submit()">${t('submit')}</button>
      </div>
    </div>
    <div class="card" style="font-size:13.5px;color:#555">${tt.instructions}</div>
    <div id="qs"></div>`;
  const qs = document.getElementById('qs');
  tt.questions.forEach(q => {
    const [cls, label] = difficulty(q.n, total);
    const div = document.createElement('div');
    div.className = 'card';
    div.id = 'q' + q.n;
    div.innerHTML = `
      <div class="qhead">
        <span class="qnum">${t('problem')} ${q.n}</span>
        <span style="display:flex;gap:6px">
          <span class="diff ${cls}">${label}</span>
          <span class="badge">${q.type === 'proof' ? t('realProblem') + ' ' + q.source : t('modifiedFrom') + ' ' + q.source}</span>
        </span>
      </div>
      <div class="qtext">${q.question}</div>
      ${q.type === 'proof'
        ? `<button class="btn secondary" onclick="document.getElementById('sol${q.n}').style.display='block'; this.style.display='none'">${t('showSolution')}</button>`
        : ''}
      <div class="choices">${q.choices ? Object.entries(q.choices).map(([L, v]) => `
        <div class="choice" data-q="${q.n}" data-l="${L}" onclick="pick(${q.n},'${L}')">
          <span class="letter">${L}</span><span>${v}</span>
        </div>`).join('')
        : q.type === 'proof' ? ''
        : `<input class="int-input" id="int${q.n}" type="text" inputmode="numeric" maxlength="3"
                  placeholder="000–999" oninput="typed(${q.n}, this.value)">`}
      </div>
      <div class="solution" id="sol${q.n}">${q.answer ? `<b>${t('answer')}: ${q.answer}.</b> ` : ''}${q.solution || `<i>${t('noSolution')}</i>`}</div>`;
    qs.appendChild(div);
    renderMath(div);
  });
}

function typed(n, v) {
  if (state.submitted) return;
  if (v.trim() === '') delete state.answers[n]; else state.answers[n] = v.trim();
  const total = state.test.questions.length;
  document.getElementById('progress').textContent =
    `${Object.keys(state.answers).length} / ${total} ${t('answered')}`;
}

function pick(n, L) {
  if (state.submitted) return;
  state.answers[n] = L;
  document.querySelectorAll(`.choice[data-q="${n}"]`).forEach(c =>
    c.classList.toggle('selected', c.dataset.l === L));
  const total = state.test.questions.length;
  document.getElementById('progress').textContent =
    `${Object.keys(state.answers).length} / ${total} answered`;
}

function submit() {
  if (state.submitted) return;
  state.submitted = true;
  clearInterval(state.timerId);
  stopLeaveWatch();
  let score = 0, gradable = 0;
  state.test.questions.forEach(q => {
    if (q.type === 'proof') {
      const card = document.getElementById('q' + q.n);
      card.classList.add('submitted');
      return; // proof questions are not auto-graded
    }
    gradable++;
    const card = document.getElementById('q' + q.n);
    card.classList.add('submitted');
    if (q.choices) {
      card.querySelectorAll('.choice').forEach(c => {
        if (c.dataset.l === q.answer) c.classList.add('correct');
        else if (state.answers[q.n] === c.dataset.l) c.classList.add('wrong');
      });
      if (state.answers[q.n] === q.answer) score++;
    } else {
      const inp = document.getElementById('int' + q.n);
      const given = (state.answers[q.n] || '').replace(/^0+(?=\d)/, '');
      const want = String(q.answer).replace(/^0+(?=\d)/, '');
      const ok = given !== '' && given === want;
      inp.classList.add(ok ? 'correct' : 'wrong');
      inp.disabled = true;
      if (ok) score++;
    }
  });
  const total = state.test.questions.length;
  const bar = document.querySelector('.sticky-bar');
  const scoreText = gradable === 0
    ? t('solutionsRevealed')
    : `${t('score')}: ${score} / ${gradable}${gradable < total ? ` (+${total - gradable} ${t('proof')})` : ''}`;
  bar.insertAdjacentHTML('beforeend', `<span class="score">${scoreText}</span><span class="saved-note" id="savedNote">saving…</span>`);
  window.scrollTo({top: 0, behavior: 'smooth'});
  // record the attempt
  const duration_s = Math.round((Date.now() - (state.startedAt || Date.now())) / 1000);
  fetch('/api/result', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      test_id: state.test.id, title: state.test.title, competition: state.test.competition,
      score, total: gradable, answered: Object.keys(state.answers).length, duration_s,
    }),
  }).then(r => {
    document.getElementById('savedNote').textContent = t('savedOk');
  }).catch(() => {
    document.getElementById('savedNote').textContent = t('savedFail');
  });
}

async function myTests() {
  clearInterval(state.timerId);
  const [tests, resultsRaw] = await Promise.all([
    (await fetch('/api/tests')).json(),
    (await fetch('/api/results')).json(),
  ]);
  const results = resultsRaw.reverse();
  document.getElementById('testCount').textContent = tests.length ? `(${tests.length})` : '';
  let html = '<h2 class="section-title">' + t('currentTests') + '</h2><div class="gen-grid">';
  html += (tests.map(tst => `
    <div class="card compact test-item" onclick="openTest('${tst.id}')">
      <div>
        <h3>${tst.title}</h3>
        <div class="meta">${tst.competition} · ${tst.n_questions} ${t('questions')} · ${tst.time_limit_min} ${t('min')}</div>
      </div>
      <button class="btn">${t('start')}</button>
    </div>`).join('') || '<div class="card compact">' + t('noTests') + '</div>');
  html += '</div><h2 class="section-title">' + t('pastTests') + '</h2>';
  if (!results.length) {
    html += '<div class="card compact">' + t('noAttempts') + '</div>';
  } else {
    html += results.map(r => {
      const pct = r.total ? Math.round(r.score / r.total * 100) : null;
      const dur = r.duration_s ? `${Math.floor(r.duration_s/60)}m${r.duration_s%60}s` : '–';
      return `
      <div class="card compact test-item">
        <div>
          <h3>${r.title || r.test_id}</h3>
          <div class="meta">${r.competition} · ${t('submitted')} ${r.submitted_at} · ${r.answered}/${r.total || '?'} ${t('answered')} · ${dur}</div>
        </div>
        <div style="display:flex;gap:14px;align-items:center">
          ${pct !== null ? `<span class="score" style="font-size:18px">${pct}%</span>` : `<span class="meta">${t('proof')}</span>`}
          <button class="btn" onclick="openTest('${r.test_id}')">${t('retake')}</button>
        </div>
      </div>`;
    }).join('');
  }
  app.innerHTML = html;
}

async function stats() {
  clearInterval(state.timerId);
  const s = await (await fetch('/api/stats')).json();
  const rows = s.per_competition.map(c => {
    const avg = c.avg_pct ?? '–';
    const best = c.best_pct ?? '–';
    const w = c.avg_pct ?? 0;
    return `<tr>
      <td>${c.competition}</td><td>${c.attempts}</td>
      <td>${avg}${c.avg_pct !== null ? '%' : ''} <span class="pct-bar"><div style="width:${w}%"></div></span></td>
      <td>${best}${c.best_pct !== null ? '%' : ''}</td>
    </tr>`;
  }).join('');
  app.innerHTML = `
    <div class="card" style="display:flex;gap:32px;flex-wrap:wrap">
      <div><div class="score">${s.total_attempts}</div><div class="meta">${t('testsTaken')}</div></div>
      <div><div class="score">${s.total_questions_answered}</div><div class="meta">${t('questionsAnswered')}</div></div>
      <div><div class="score">${s.avg_pct !== null ? s.avg_pct + '%' : '–'}</div><div class="meta">${t('averageScore')}</div></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:10px">${t('byCompetition')}</h3>
      ${rows ? `<table class="stats"><tr><th>${t('competition')}</th><th>${t('attempts')}</th><th>${t('average')}</th><th>${t('best')}</th></tr>${rows}</table>` : t('noAttempts')}
    </div>`;
}

setLang(LANG);
home();

// --- auto-close a test 30s after the student leaves the test view ---
let leaveTimer = null, leaveCountdown = null;

function startLeaveWatch(pendingTab) {
  if (leaveTimer) return;
  const warn = document.getElementById('leaveWarn');
  warn.style.display = 'block';
  warn.innerHTML = `${t('leaveWarn1')} <b><span id="leaveCount">30</span>${t('leaveWarn2')}</b> <u style="cursor:pointer" onclick="returnToTest()">↩</u>`;
  let left = 30;
  leaveCountdown = setInterval(() => {
    left--;
    const el = document.getElementById('leaveCount');
    if (el) el.textContent = left;
    if (left <= 0) exitTest(true, pendingTab);
  }, 1000);
  leaveTimer = true;
}

function stopLeaveWatch() {
  document.getElementById('leaveWarn').style.display = 'none';
  clearInterval(leaveCountdown);
  leaveTimer = null;
}

function returnToTest() {
  stopLeaveWatch();
  renderTest();  // state (answers, deadline) is preserved
  // restore picked answers
  for (const [n, v] of Object.entries(state.answers)) {
    const c = document.querySelector(`.choice[data-q="${n}"][data-l="${v}"]`);
    if (c) c.classList.add('selected');
    const inp = document.getElementById('int' + n);
    if (inp) inp.value = v;
  }
  const total = state.test.questions.length;
  document.getElementById('progress').textContent = `${Object.keys(state.answers).length} / ${total} ${t('answered')}`;
}

function exitTest(fromLeave, pendingTab) {
  clearInterval(state.timerId);
  stopLeaveWatch();
  state = { ...state, test: null, answers: {}, submitted: false };
  doShowTab(pendingTab || 'tests');
  if (fromLeave) {
    const d = document.createElement('div');
    d.className = 'card compact';
    d.style.cssText = 'background:#fde4e4;color:#b02929;font-weight:600';
    d.textContent = t('closedWarn');
    document.getElementById('app').prepend(d);
  }
}

document.addEventListener('visibilitychange', () => {});  // leaving the screen no longer triggers closing
</script>
