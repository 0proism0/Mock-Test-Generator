<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MockTest Maker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         background: #f4f5f7; color: #1c1e21; line-height: 1.55; }
  .container { max-width: 1240px; width: 100%; margin: 0 auto; padding: 24px 20px 80px; }
  header.top { background: #2b3a4a; color: #fff; padding: 18px 0; }
  header.top .container { padding: 0 16px; }
  header.top h1 { font-size: 20px; }
  header.top p { font-size: 13px; opacity: .75; }
  .card { background: #fff; border-radius: 12px; padding: 20px 22px; margin-top: 16px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card.compact { padding: 12px 18px; margin-top: 10px; }
  .gen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  @media (max-width: 720px) { .gen-grid { grid-template-columns: 1fr; } }
  .section-title { margin-top: 20px; font-size: 16px; color: #334; }
  .leave-warn { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #b02929;
                color: #fff; text-align: center; padding: 12px; font-weight: 700; display: none; }
  .test-item { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .test-item:hover { border-color: #2b3a4a; }
  .test-item h3 { font-size: 16px; }
  .test-item .meta { font-size: 13px; color: #666; margin-top: 4px; }
  .btn { background: #2b6cb0; color: #fff; border: none; border-radius: 8px;
         padding: 9px 18px; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #245a94; }
  .btn.secondary { background: #e2e8f0; color: #2d3748; }
  .qhead { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .qnum { font-weight: 700; font-size: 16px; }
  .badge { font-size: 11.5px; background: #eef2f7; color: #4a5568; border-radius: 20px;
           padding: 3px 10px; }
  .diff { font-size: 11.5px; border-radius: 20px; padding: 3px 10px; }
  .diff.easy { background: #e6f6e6; color: #237a23; }
  .diff.mid  { background: #fff4db; color: #976d00; }
  .diff.hard { background: #fde4e4; color: #b02929; }
  .qtext { margin: 10px 0 12px; font-size: 15.5px; }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice { display: flex; gap: 10px; align-items: baseline; border: 1.5px solid #dde3ea;
            border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 15px; background: #fff; }
  .choice:hover { border-color: #2b6cb0; }
  .choice.selected { border-color: #2b6cb0; background: #ebf3fb; }
  .choice.correct { border-color: #2f9e44; background: #e6f6e6; }
  .choice.wrong { border-color: #e03131; background: #fde4e4; }
  .choice .letter { font-weight: 700; min-width: 18px; }
  .int-input { font-size: 16px; padding: 8px 12px; border: 1.5px solid #dde3ea; border-radius: 8px;
               width: 140px; font-variant-numeric: tabular-nums; }
  .int-input.correct { border-color: #2f9e44; background: #e6f6e6; }
  .int-input.wrong { border-color: #e03131; background: #fde4e4; }
  .solution { margin-top: 12px; padding: 12px 14px; background: #f8fafc; border-left: 3px solid #2b6cb0;
              border-radius: 6px; font-size: 14.5px; display: none; }
  .submitted .solution { display: block; }
  .sticky-bar { position: sticky; top: 0; z-index: 10; background: #fff; border-radius: 12px;
                padding: 12px 18px; margin-top: 16px; display: flex; justify-content: space-between;
                align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; }
  .timer.low { color: #e03131; }
  .progress { font-size: 13px; color: #666; }
  .score { font-size: 22px; font-weight: 800; }
  .hidden { display: none; }
  .tabs { display: flex; gap: 4px; background: #1f2c3a; padding: 0 16px; }
  .tabs .container { display: flex; gap: 2px; padding: 0; align-items: center; }
  .tab { position: relative; padding: 10px 14px; color: #b8c4d0; cursor: pointer;
         border-bottom: 3px solid transparent; display: flex; align-items: center; }
  .tab svg { width: 20px; height: 20px; display: block; }
  .tab::after { content: attr(data-label); position: absolute; top: calc(100% + 6px); left: 50%;
                transform: translateX(-50%); background: #1f2c3a; color: #fff; font-size: 12px;
                padding: 4px 9px; border-radius: 6px; white-space: nowrap; opacity: 0;
                pointer-events: none; transition: opacity .12s; z-index: 60;
                box-shadow: 0 3px 10px rgba(0,0,0,.3); }
  .tab:hover::after { opacity: 1; }
  .tab-badge { background: #e03131; color: #fff; border-radius: 10px; font-size: 10.5px;
               padding: 1px 5px; margin-left: 3px; line-height: 1.4; }
  .tab-badge:empty { display: none; }
  .lang-toggle { margin-left: auto; display: flex; border: 1px solid #4a5a6a; border-radius: 6px; overflow: hidden; }
  .lang-toggle span { padding: 6px 12px; cursor: pointer; font-size: 13px; color: #b8c4d0; }
  .lang-toggle span.on { background: #2b6cb0; color: #fff; }
  .tab:hover { color: #fff; }
  .tab.active { color: #fff; border-bottom-color: #5ea3f7; }
  table.stats { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.stats th, table.stats td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
  table.stats th { color: #666; font-weight: 600; font-size: 12.5px; }
  .pct-bar { background: #e2e8f0; border-radius: 4px; height: 8px; width: 120px; display: inline-block; vertical-align: middle; }
  .pct-bar > div { background: #2b6cb0; height: 8px; border-radius: 4px; }
  .saved-note { color: #237a23; font-size: 13px; margin-left: 10px; }
  .auth-box { max-width: 360px; margin: 40px auto; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .auth-tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; background: #e2e8f0; color: #2d3748; }
  .auth-tab.active { background: #2b6cb0; color: #fff; }
  .auth-form { display: flex; flex-direction: column; gap: 12px; }
  .auth-form input { font-size: 15px; padding: 10px 12px; border: 1.5px solid #dde3ea; border-radius: 8px; }
  .auth-form .btn { width: 100%; }
  .auth-msg { font-size: 13px; min-height: 18px; }
  .auth-msg.err { color: #b02929; }
  .auth-msg.ok { color: #237a23; }
  .ann-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding-top: 8vh; }
  .ann-modal { background: #fff; border-radius: 10px; max-width: 560px; width: 92%; max-height: 75vh; overflow-y: auto; padding: 18px 22px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .ann-title-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .ann-title-bar h3 { margin: 0; }
  .ann-item { border-top: 1px solid #eee; padding: 10px 0; }
  .ann-item:first-of-type { border-top: none; }
  .ann-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ann-title { font-weight: 600; }
  .ann-date { color: #999; font-size: 12px; white-space: nowrap; }
  .ann-body { color: #444; font-size: 14px; margin-top: 4px; white-space: pre-wrap; }
  .fr-layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 800px) { .fr-layout { grid-template-columns: 1fr; } }
  .fr-add { display: flex; gap: 8px; }
  .fr-add input { flex: 1; }
  .fr-req { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-top: 1px solid #eee; }
  .fr-item { display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-top: 1px solid #eee; cursor: pointer; border-radius: 6px; }
  .fr-item:hover { background: #f5f7fa; }
  .fr-item.active { background: #eaf1fb; }
  .fr-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
  .fr-status { font-size: 12px; color: #999; }
  .fr-x { color: #bbb; font-size: 12px; padding: 0 4px; }
  .fr-x:hover { color: #b02929; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #c6ccd4; display: inline-block; flex: none; }
  .dot.on { background: #2fae5f; }
  .chat-card { min-height: 420px; display: flex; flex-direction: column; }
  .chat-head { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
  .chat-msgs { flex: 1; overflow-y: auto; min-height: 260px; max-height: 55vh; padding: 10px 2px; }
  .chat-row { display: flex; margin: 4px 0; }
  .chat-row.mine { justify-content: flex-end; }
  .bubble { max-width: 70%; padding: 7px 11px; border-radius: 12px; background: #eef1f5; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .chat-row.mine .bubble { background: #2f6fb0; color: #fff; }
  .chat-input { display: flex; gap: 8px; padding-top: 8px; border-top: 1px solid #eee; }
  .chat-input input { flex: 1; }
  .btn.sm { padding: 4px 10px; font-size: 12px; }
  .btn.ghost { background: #e5e9ee; color: #333; }
  .pk-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .pk-form select { min-width: 130px; }
  .pk-row small { color: #555; }
  .pk-mode-tabs { display: flex; gap: 0; border: 1.5px solid #cbd5e0; border-radius: 10px;
                  overflow: hidden; margin-bottom: 10px; max-width: 320px; }
  .pk-mode-tab { flex: 1; padding: 7px 0; text-align: center; font-size: 14px; font-weight: 700;
                 cursor: pointer; background: #fff; color: #66707c; }
  .pk-mode-tab.on { background: #2b3a4a; color: #fff; }
  .race-friends { display: flex; flex-wrap: wrap; gap: 6px; max-height: 120px; overflow-y: auto;
                  margin-bottom: 8px; }
  .race-friend { display: flex; align-items: center; gap: 4px; border: 1px solid #cbd5e0;
                 border-radius: 18px; padding: 4px 10px; font-size: 13px; cursor: pointer; background: #fff; }
  .race-friend:has(input:checked) { background: #ebf3fb; border-color: #2b6cb0; }
  .pk-stand-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
                  padding: 3px 0; font-size: 14px; border-top: 1px dashed #eee; }
  .pk-stand-row:first-child { border-top: none; }
  .cl-join-box { background: #f0f6ff; border: 1.5px solid #c9dcff; border-radius: 12px; padding: 14px 16px; margin-bottom: 6px; }
  /* --- games --- */
  .game-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .game-card { cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .game-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(30,50,80,.12); }
  .fc-wrap { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  .fc-board { display: grid; grid-template-columns: repeat(8, 44px); grid-template-rows: repeat(8, 44px);
              border: 2px solid #8a94a6; border-radius: 6px; overflow: hidden; user-select: none; }
  .fc-cell { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
             font-size: 26px; cursor: default; }
  .fc-cell.lit { background: #eef3fb; }
  .fc-cell.sel { box-shadow: inset 0 0 0 3px #4a7dff; }
  .fc-cell.tgt { box-shadow: inset 0 0 0 3px #ffb84d; }
  .fc-you { color: #2b6fe3; } .fc-ai { color: #d3453d; }
  .fc-side { min-width: 210px; max-width: 260px; }
  .fc-funcs { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .fc-func { font-size: 17px; padding: 9px 12px; border: 1.5px solid #c9d4e4; border-radius: 8px;
             background: #fff; cursor: pointer; font-family: ui-monospace, Menlo, monospace; }
  .fc-func:hover:not(:disabled) { border-color: #4a7dff; background: #f0f6ff; }
  .fc-func:disabled { opacity: .35; cursor: not-allowed; }
  .gw-wrap { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  .gw-canvas-box { border: 1.5px solid #c9d4e4; border-radius: 8px; background: #fff; }
  .gw-ctl { min-width: 230px; max-width: 280px; }
  .gw-ctl label { font-size: 13px; color: #555; display: block; margin: 8px 0 2px; }
  .gw-ctl input[type=range] { width: 100%; }
  .cl-code { font-family: ui-monospace, Menlo, monospace; font-size: 18px; font-weight: 800;
             background: #f1f4f8; border-radius: 8px; padding: 4px 12px; letter-spacing: 1px; }
  .cl-students { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .cl-student { display: flex; align-items: center; gap: 5px; background: #f1f4f8; border-radius: 16px;
                padding: 3px 10px; font-size: 13px; }
  .cl-reports { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 8px; }
  .cl-reports th, .cl-reports td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  .cl-reports th { color: #666; font-weight: 600; font-size: 12px; }
  /* --- whiteboard --- */
  .wb-layout { display: grid; grid-template-columns: 310px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 800px) { .wb-layout { grid-template-columns: 1fr; } }
  .wb-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .wb-tool { padding: 5px 10px; border-radius: 8px; border: 1px solid #cbd5e0; background: #fff;
             cursor: pointer; font-size: 13px; }
  .wb-tool:hover { border-color: #2b6cb0; }
  .wb-tool.on { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
  .wb-color { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff;
              box-shadow: 0 0 0 1px #cbd5e0; cursor: pointer; flex: none; }
  .wb-color.on { box-shadow: 0 0 0 2px #1c1e21; }
  .wb-sel-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .wb-grp-row { display: flex; gap: 0; margin-bottom: 6px; border: 1.5px solid #dde3ea; border-radius: 8px; overflow: hidden; }
  .wb-grp { flex: 1; padding: 6px 0; font-size: 13px; font-weight: 600; background: #f1f4f8; color: #555; border: none; cursor: pointer; }
  .wb-grp.on { background: #fff; color: #1c1e21; box-shadow: inset 0 -2px 0 #4a7dff; }
  .wb-sel-row select, .wb-search { font-size: 13px; padding: 6px 8px; border: 1.5px solid #dde3ea;
                                    border-radius: 8px; background: #fff; width: 100%; }
  .wb-items { max-height: 48vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
              padding: 4px 2px 4px 0; }
  .wb-item { border: 1px solid #dde3ea; border-radius: 8px; padding: 6px 9px; cursor: pointer;
             background: #fff; text-align: left; font-size: 13.5px; line-height: 1.9;
             overflow-wrap: anywhere; display: flex; align-items: baseline; gap: 6px; }
  .wb-item:hover { border-color: #2b6cb0; background: #ebf3fb; }
  .wb-item .wb-tag { flex: none; font-size: 10px; color: #98a2ae; background: #f1f4f8;
                     border-radius: 4px; padding: 0 4px; align-self: center; }
  .wb-custom-btn { width: 100%; margin-top: 10px; }
  .wb-edit { position: absolute; top: -8px; left: -8px; width: 18px; height: 18px; border-radius: 50%;
             background: #2b6cb0; color: #fff; font-size: 11px; line-height: 17px; text-align: center;
             cursor: pointer; display: none; }
  .wb-note:hover .wb-edit { display: block; }
  .wb-editor { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 5000; background: #fff;
               border: 1.5px solid #cbd5e0; border-radius: 10px;
               box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 10px 12px; }
  .wb-ed-row { display: flex; gap: 10px; align-items: flex-start; }
  .wb-ed-tex { flex: 1; min-width: 0; font-size: 14px; padding: 8px 10px; border: 1.5px solid #dde3ea;
               border-radius: 8px; resize: vertical; font-family: ui-monospace, Menlo, monospace; }
  .wb-ed-prev { flex: 1; min-width: 0; border: 1px dashed #e2e8f0; border-radius: 8px; padding: 8px 10px;
                min-height: 42px; max-height: 130px; overflow: auto; font-size: 15px; background: #fafbfc; }
  .wb-ed-prev.err { color: #b02929; border-color: #f3c2c2; background: #fdf3f3; font-size: 12.5px; }
  .wb-ed-prev.plain { font-family: inherit; font-size: 14.5px; white-space: pre-wrap; }
  .wb-ed-btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .wb-kb { margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; }
  .wb-kb.hidden { display: none; }
  .wb-kb-tabs { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
  .wb-kb-tab { padding: 3px 10px; font-size: 12px; border-radius: 14px; border: 1px solid #cbd5e0;
               background: #fff; cursor: pointer; }
  .wb-kb-tab.on { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
  .wb-kb-keys { display: flex; flex-wrap: wrap; gap: 4px; max-height: 128px; overflow-y: auto; }
  .wb-key { min-width: 30px; padding: 4px 7px; font-size: 13px; border: 1px solid #dde3ea;
            border-radius: 6px; background: #fff; cursor: pointer;
            font-family: ui-monospace, Menlo, monospace; }
  .wb-key:hover { background: #ebf3fb; border-color: #2b6cb0; }
  .wb-board-wrap { position: relative; padding: 0; overflow: hidden;
                   height: calc(100vh - 235px); min-height: 460px; }
  #wbCanvas { position: absolute; inset: 0; width: 100%; height: 100%; background: #fff;
              border-radius: 12px; touch-action: none; cursor: crosshair; }
  .wb-note { position: absolute; cursor: grab; background: #fff; border: 1px solid #cbd5e0;
             border-radius: 8px; padding: 5px 10px; box-shadow: 0 2px 6px rgba(0,0,0,.14);
             user-select: none; touch-action: none; }
  .wb-note:active { cursor: grabbing; }
  .wb-del { position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; border-radius: 50%;
            background: #e03131; color: #fff; font-size: 12px; line-height: 17px; text-align: center;
            cursor: pointer; display: none; }
  .wb-note:hover .wb-del { display: block; }
</style>
</head>
<body>
<header class="top"><div class="container">
  <h1>📝 MockTest Maker</h1>
  <p id="headerSubtitle">Mock exams built from real competition problems — numbers modified, difficulty preserved</p>
</div></header>
<nav class="tabs"><div class="container">
  <div class="tab active" data-tab="new" onclick="showTab('new')" id="tabNew" data-label="New Test"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8.5v7M8.5 12h7"/></svg></div>
  <div class="tab" data-tab="tests" onclick="showTab('tests')" id="tabTests" data-label="My Tests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l5 5v15H6z"/><path d="M14 2v5h5"/><path d="M9 13h6M9 17h4"/></svg><span class="tab-badge" id="testCount"></span></div>
  <div class="tab" data-tab="stats" onclick="showTab('stats')" id="tabStats" data-label="Stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20v-7M11 20V5M17 20v-4"/><path d="M2 20h20"/></svg></div>
  <div class="tab" data-tab="wb" onclick="showTab('wb')" id="tabWB" data-label="Whiteboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></div>

let LANG = localStorage.getItem('mt_lang') || 'en';
const t = (k, ...a) => { let s = (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k; a.forEach((v, i) => { s = s.split('{' + i + '}').join(v); }); return s; };

function setLang(l) {
  LANG = l;
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
  localStorage.setItem('mt_lang', l);
  document.getElementById('langEN').classList.toggle('on', l === 'en');
  document.getElementById('langZH').classList.toggle('on', l === 'zh');
  const tip = k => { const s = t(k); const i = s.indexOf(' '); return i < 0 ? s : s.slice(i + 1); };  // strip leading emoji
  document.getElementById('tabNew').dataset.label = tip('tabNew');
  document.getElementById('tabTests').dataset.label = tip('tabTests');
  document.getElementById('tabStats').dataset.label = tip('tabStats');
  document.getElementById('tabWB').dataset.label = t('tabWhiteboard');
  const tf = document.getElementById('tabFriends');
  if (tf) tf.dataset.label = tip('tabFriends');
  const tp = document.getElementById('tabPK');
  if (tp) tp.dataset.label = tip('tabPK');
  const tc = document.getElementById('tabClasses');
  if (tc) tc.dataset.label = t('tabClasses');
  const sub = document.getElementById('headerSubtitle');
  if (sub) sub.textContent = t('headerSubtitle');
  const app = document.getElementById('app');
  if (app && app.textContent === 'Loading…' || app.textContent === '加载中…') app.textContent = t('loading');
  updateUserArea();
  // re-render current view
  if (state.test && document.querySelector('.sticky-bar')) {
    renderTest();
    for (const [n, v] of Object.entries(state.answers)) {
      const c = document.querySelector(`.choice[data-q="${n}"][data-l="${v}"]`);
      if (c) c.classList.add('selected');
      const inp = document.getElementById('int' + n);
      if (inp) inp.value = v;
    }
    if (state.submitted) {
      // re-apply grading visuals is complex; simplest: re-submit visually
      document.querySelectorAll('.card.submitted').forEach(c => c.classList.remove('submitted'));
    }
  } else if (!state.user && state.authMode) {
    renderAuth();
  } else {
    doShowTab(state.tab || 'new');
  }
}
let state = { test: null, answers: {}, submitted: false, deadline: null, timerId: null, startedAt: null, tab: 'new', user: null, authMode: 'login', authRole: 'student', role: 'student', school: '', pkMode: 'duel', badgeTimer: null, seenInvites: [], inviteDismissed: [] };
let inviteQueue = [];
let inviteShowing = false;

function updateUserArea() {
  const area = document.getElementById('userArea');
  if (!area) return;
  const friendsTab = document.getElementById('tabFriends');
  const pkTab = document.getElementById('tabPK');
  if (state.user) {
    area.innerHTML = `<span style="cursor:pointer" onclick="showAnnouncements()">${t('announcements')}</span><span>${state.user}</span><span style="cursor:pointer" onclick="logout()">${t('logout')}</span>`;
    if (friendsTab) friendsTab.style.display = '';
    if (pkTab) pkTab.style.display = '';
    const clTab = document.getElementById('tabClasses');
    if (clTab) clTab.style.display = '';
  } else {
    area.innerHTML = `<span style="cursor:pointer" onclick="showAuth('login')">${t('login')}</span>`;
    if (friendsTab) friendsTab.style.display = 'none';
    if (pkTab) pkTab.style.display = 'none';
    const clTab2 = document.getElementById('tabClasses');
    if (clTab2) clTab2.style.display = 'none';
  }
}

async function init() {
  setLang(LANG);
  const r = await fetch('/api/me', { credentials: 'same-origin' });
  const data = await r.json();
  if (data.user) {
    state.user = data.user;
    state.role = data.role || 'student';
    state.school = data.school || '';
    updateUserArea();
    updateBadges();
    startBadgePoll();
    doShowTab('tests');
  } else {
    state.tab = 'new';
    updateUserArea();
    doShowTab('new');
  }
}

function showAuth(mode) {
  state.authMode = mode;
  renderAuth();
}

        ${!loginActive ? `
        <label style="font-size:13px;color:#666">${t('authConfirm')}</label>
        <input type="password" id="authPass2" autocomplete="new-password" required>` : ''}
        ${!loginActive && state.authRole === 'teacher' ? `
        <label style="font-size:13px;color:#666">${t('school')}</label>
        <input type="text" id="authSchool" required>` : ''}
        <button type="submit" class="btn">${loginActive ? t('login') : t('register')}</button>
      </form>
      <div class="auth-msg" id="authMsg"></div>
    </div>`;
}

async function doLogin() {
  const username = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  const msg = document.getElementById('authMsg');
  msg.className = 'auth-msg';
  msg.textContent = '';
  if (!username || !password) {
    msg.className = 'auth-msg err';
    msg.textContent = t('authFillAll');
    return;
  }
  const r = await fetch('/api/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin',
    body: JSON.stringify({username, password}),
  });
  const data = await r.json();
  if (data.ok) {
    state.user = data.user;
    await refreshMe();
    updateUserArea();
    updateBadges();
    startBadgePoll();
    state.authMode = null;
    doShowTab(state.tab && state.tab !== 'new' ? state.tab : 'tests');
  } else {
    msg.className = 'auth-msg err';
    msg.textContent = data.error || 'login failed';
  }
}

async function doRegister() {
  const username = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  const msg = document.getElementById('authMsg');
  msg.className = 'auth-msg';
  msg.textContent = '';
  const pass2 = document.getElementById('authPass2') ? document.getElementById('authPass2').value : '';
  const schoolEl = document.getElementById('authSchool');
  if (!username || !password || (schoolEl && !schoolEl.value.trim())) {
    msg.className = 'auth-msg err';
    msg.textContent = t('authFillAll');
    return;
  }
  if (password !== pass2) {
    msg.className = 'auth-msg err';
    msg.textContent = t('authPassMismatch');
    return;
  }
  const body = {username, password, role: state.authRole};
  if (state.authRole === 'teacher' && schoolEl) body.school = schoolEl.value.trim();
  const r = await fetch('/api/register', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin',
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (data.ok) {
    state.user = data.user;
    await refreshMe();
    updateUserArea();
    updateBadges();
    startBadgePoll();
    state.authMode = null;
    doShowTab('tests');
  } else {
    msg.className = 'auth-msg err';
    msg.textContent = data.error || 'register failed';
  }
}

async function showAnnouncements() {
  let items = [];
  try {
    const r = await fetch('/api/announcements', {credentials: 'same-origin'});
    if (r.ok) items = (await r.json()).announcements || [];
  } catch (e) { /* fall through, show empty state */ }
  const old = document.getElementById('annOverlay');
  if (old) old.remove();
  const rows = items.length
    ? items.map(a => `
      <div class="ann-item">
        <div class="ann-head"><span class="ann-title">${escapeHtml(a.title || '')}</span><span class="ann-date">${escapeHtml(a.date || '')}</span></div>
        <div class="ann-body">${escapeHtml(a.body || '')}</div>
      </div>`).join('')
    : `<p style="color:#666">${t('noAnnouncements')}</p>`;
  const overlay = document.createElement('div');
  overlay.id = 'annOverlay';
  overlay.className = 'ann-overlay';
  overlay.innerHTML = `
    <div class="ann-modal">
      <div class="ann-title-bar"><h3>${t('announcements')}</h3>
        <button class="btn" onclick="closeAnnouncements()">${t('close')}</button></div>
      ${rows}
    </div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeAnnouncements(); });
  document.body.appendChild(overlay);
}

function closeAnnouncements() {
  const o = document.getElementById('annOverlay');
  if (o) o.remove();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

async function logout() {
  stopChatPolling();
  stopPkPolling();
  await fetch('/api/logout', {method: 'POST', credentials: 'same-origin'});
  state.user = null;
  state.role = 'student';
  state.school = '';
  stopBadgePoll();
  state.test = null; state.answers = {}; state.submitted = false;
  updateUserArea();
  doShowTab('new');
}

// --- identity + PK invite badge ---
async function refreshMe() {
  try {
    const d = await (await fetch('/api/me', {credentials: 'same-origin'})).json();
    state.role = d.role || 'student';
    state.school = d.school || '';
  } catch (e) { state.role = 'student'; }
}
async function updatePkBadge() {
  const b = document.getElementById('pkBadge');
  if (!b || !state.user) return;
  if (state.tab === 'pk') { b.textContent = ''; }  // invites visible on the PK tab itself
  try {
    const d = await (await fetch('/api/pk/invites', {credentials: 'same-origin'})).json();
    if (state.tab !== 'pk') b.textContent = d.count || '';
    // surface new invites as a fullscreen modal
    for (const inv of (d.invites || [])) {
      if (!state.seenInvites.includes(inv.game_id)) {
        state.seenInvites.push(inv.game_id);
        if (!state.inviteDismissed.includes(inv.game_id)) inviteQueue.push(inv);
      }
    }
    inviteQueue = inviteQueue.filter(inv => (d.invites || []).some(i => i.game_id === inv.game_id));
    showInviteModal();
  } catch (e) { /* keep old badge */ }
}
async function updateFriendsBadge() {
  const b = document.getElementById('friendsBadge');
  if (!b || !state.user) return;
  if (state.tab === 'friends') { b.textContent = ''; return; }
  try {
    const d = await (await fetch('/api/friends/badge', {credentials: 'same-origin'})).json();
    b.textContent = d.count || '';
  } catch (e) { /* keep old badge */ }
}
function updateBadges() { updatePkBadge(); updateFriendsBadge(); }
function startBadgePoll() {
  stopBadgePoll();
  state.badgeTimer = setInterval(updateBadges, 10000);
}
function stopBadgePoll() {
  if (state.badgeTimer) { clearInterval(state.badgeTimer); state.badgeTimer = null; }
  const b = document.getElementById('pkBadge');
  if (b) b.textContent = '';
}

// ---------- PK (1v1 battle) ----------
function stopPkPolling() {
  if (state.pkTimer) { clearInterval(state.pkTimer); state.pkTimer = null; }
}

async function pk() {
  const _myTab = state.tab;  // capture: render only if still current
  stopPkPolling();
  const [fr, banks, pkData] = await Promise.all([
    fetch('/api/friends', {credentials: 'same-origin'}).then(r => r.json()),
    fetch('/api/banks', {credentials: 'same-origin'}).then(r => r.json()),
    fetch('/api/pk', {credentials: 'same-origin'}).then(r => r.json()),
  ]);
  const friends = fr.friends || [];
  const comps = (banks || []).filter(b => !b.round);
  const games = pkData.games || [];
  const duels = games.filter(g => g.mode !== 'race');
  const races = games.filter(g => g.mode === 'race');
  const pendingInD = duels.filter(g => g.status === 'pending' && g.role === 'opponent');
  const pendingOutD = duels.filter(g => g.status === 'pending' && g.role === 'challenger');
  const pendingInR = races.filter(g => g.status === 'pending' && !g.is_host);
  const pendingOutR = races.filter(g => g.status === 'pending' && g.is_host);
  const active = games.filter(g => g.status === 'active' || g.status === 'submitted');
  const history = games.filter(g => ['done', 'declined', 'expired'].includes(g.status));

  const compName = slug => (comps.find(c => c.slug === slug) || {}).name || slug;
  const diffName = d => t(d === 'easy' ? 'easy' : d === 'hard' ? 'hard' : 'medium');
  const fmtDur = s => s == null ? '—' : `${Math.floor(s / 60)}m${String(s % 60).padStart(2, '0')}s`;
  const scoreLine = g => {
    const ms = g.my.done ? `${g.my.score}/${g.my.total}` : '—';
    const ts = g.their.done ? `${g.their.score}/${g.their.total}` : (g.status === 'active' ? t('pkInProgress') : '—');
    return `${t('pkYou')} <b>${ms}</b> : <b>${ts}</b> ${escapeHtml(g.opponent)}`;
  };
  const rowBtns = g => g.status === 'pending'
    ? (g.role === 'opponent'
        ? `<button class="btn sm" onclick="pkRespond('${g.id}', true)">${t('pkAccept')}</button>
           <button class="btn sm ghost" onclick="pkRespond('${g.id}', false)">${t('pkDecline')}</button>`
        : `<span style="color:#999;font-size:13px">⏳</span>`)
    : g.status === 'active'
      ? `<button class="btn sm" onclick="openTest('${g.test_id}')">${t('pkTakeTest')}</button>`
      : g.status === 'submitted'
        ? `<span style="color:#999;font-size:13px">⏳ ${t('pkInProgress')}</span>`
        : '';
  const resultBadge = g => {
    if (g.status === 'declined') return `<span style="color:#999">${t('pkDeclined')}</span>`;
    if (g.status === 'expired') return `<span style="color:#999">${t('pkExpired')}</span>`;
    if (g.status === 'done') {
      const w = g.winner === 'me' ? `<span style="color:#237a23">${t('pkWon')}</span>`
        : g.winner === 'them' ? `<span style="color:#b02929">${t('pkLost')}</span>`
        : `<span>${t('pkDraw')}</span>`;
      return `${w} · ${scoreLine(g)}`;
    }
    return scoreLine(g);
  };
  const gameRow = g => `
    <div class="fr-req pk-row" data-gid="${g.id}">
      <span><b>${escapeHtml(g.opponent)}</b> · ${escapeHtml(compName(g.slug))} · ${diffName(g.difficulty)}<br>
        <small>${resultBadge(g)}</small></span>
      <span>${rowBtns(g)}</span>
    </div>`;

  const medals = ['🥇', '🥈', '🥉'];
  const raceRow = g => {
    const stand = (g.standings || []).map((s, i) => `
      <div class="pk-stand-row">
        <span>${medals[i] || (i + 1) + '.'} <b>${escapeHtml(s.user)}</b>${s.user === state.user ? ` <small>(${t('pkYou')})</small>` : ''}</span>
        <span>${s.done ? `<b>${s.score}/${s.total}</b> · ${fmtDur(s.duration_s)}` : `<small style="color:#999">${t('pkInProgress')}</small>`}</span>
      </div>`).join('');
    let btn = '';
    if (g.status === 'pending') {
      btn = g.is_host
        ? `<button class="btn sm" onclick="pkStart('${g.id}')" ${g.accepted.length >= 2 ? '' : 'disabled'}>${t('pkStartRace')}</button>`
        : `<button class="btn sm" onclick="pkRespond('${g.id}', true)">${t('pkAccept')}</button>
           <button class="btn sm ghost" onclick="pkRespond('${g.id}', false)">${t('pkDecline')}</button>`;
    } else if (g.status === 'active') {
      const meDone = (g.standings || []).find(s => s.user === state.user && s.done);
      btn = meDone ? `<span style="color:#237a23;font-size:13px">✓</span>`
                   : `<button class="btn sm" onclick="openTest('${g.test_id}')">${t('pkTakeTest')}</button>`;
    }
    const winnerLine = g.status === 'done' && g.winner
      ? `<div style="font-size:13.5px;margin:2px 0">${t('pkRaceWinner')}: <b>${escapeHtml(g.winner)}</b>${g.winner === state.user ? ' 🎉' : ''}</div>` : '';
    return `<div class="card compact" data-gid="${g.id}" style="margin-top:8px">
      <div class="fr-req"><span><b>🏁 ${t('pkRace')}</b> · ${escapeHtml(compName(g.slug))} · ${diffName(g.difficulty)}${g.is_host ? ` · <small>${t('pkHost')}</small>` : ''}</span><span>${btn}</span></div>
      <div style="font-size:13px;color:#666;margin:4px 0">${t('pkJoined')}: ${g.accepted.length}/${g.players.length} — ${g.accepted.map(escapeHtml).join(', ')}${g.invited.length ? ` · ${t('pkWaiting')}: ${g.invited.map(escapeHtml).join(', ')}` : ''}</div>
      ${winnerLine}
      ${stand ? `<div style="margin-top:4px">${stand}</div>` : ''}
    </div>`;
  };

    if (state.tab !== _myTab || (state.test && !state.submitted)) return;  // stale async render
  const mode = state.pkMode || 'duel';
  app.innerHTML = `
    <div class="card">
      <h3>${t('tabPK')}</h3>
      <div class="pk-mode-tabs">
        <div class="pk-mode-tab ${mode === 'duel' ? 'on' : ''}" data-m="duel" onclick="setPkMode('duel')">⚔️ ${t('pkModeDuel')}</div>
        <div class="pk-mode-tab ${mode === 'race' ? 'on' : ''}" data-m="race" onclick="setPkMode('race')">🏁 ${t('pkModeRace')}</div>
      </div>
      <div id="pkDuelForm" class="${mode === 'duel' ? '' : 'hidden'}">
        <div class="pk-form">
          <select id="pkFriend">${friends.map(f => `<option value="${escapeHtml(f.username)}">${escapeHtml(f.username)}${f.online ? ' 🟢' : ''}</option>`).join('')}</select>
          <select id="pkComp">${comps.map(c => `<option value="${escapeHtml(c.slug)}">${escapeHtml(c.name)}</option>`).join('')}</select>
          <select id="pkDiff">
            <option value="easy">${t('easy')}</option>
            <option value="medium" selected>${t('medium')}</option>
            <option value="hard">${t('hard')}</option>
          </select>
          <button class="btn" onclick="pkChallenge()" ${friends.length ? '' : 'disabled'}>${t('pkSend')}</button>
        </div>
      </div>
      <div id="pkRaceForm" class="${mode === 'race' ? '' : 'hidden'}">
        <div style="font-size:13px;color:#666;margin-bottom:4px">${t('pkPickFriends')}</div>
        <div class="race-friends">${friends.map(f => `
          <label class="race-friend"><input type="checkbox" class="race-friend-cb" value="${escapeHtml(f.username)}"> ${escapeHtml(f.username)}${f.online ? ' 🟢' : ''}</label>`).join('') || `<span style="color:#999;font-size:13px">${t('pkNoFriends')}</span>`}</div>
        <div class="pk-form">
          <select id="pkRaceComp">${comps.map(c => `<option value="${escapeHtml(c.slug)}">${escapeHtml(c.name)}</option>`).join('')}</select>
          <select id="pkRaceDiff">
            <option value="easy">${t('easy')}</option>
            <option value="medium" selected>${t('medium')}</option>
            <option value="hard">${t('hard')}</option>
          </select>
          <button class="btn" onclick="pkChallenge()" ${friends.length ? '' : 'disabled'}>🏁 ${t('pkInvite')}</button>
        </div>
      </div>
      ${friends.length ? '' : `<p style="color:#999;font-size:13px">${t('pkNoFriends')}</p>`}
      <div id="pkMsg" class="auth-msg"></div>
      ${pendingInD.length || pendingInR.length ? `<h4 style="margin:14px 0 6px">${t('pkIncoming')}</h4>${pendingInD.map(gameRow).join('')}${pendingInR.map(raceRow).join('')}` : ''}
      ${pendingOutD.length || pendingOutR.length ? `<h4 style="margin:14px 0 6px">${t('pkOutgoing')}</h4>${pendingOutD.map(gameRow).join('')}${pendingOutR.map(raceRow).join('')}` : ''}
      ${active.length ? `<h4 style="margin:14px 0 6px">${t('pkActive')}</h4><div id="pkActiveList">${active.map(g => g.mode === 'race' ? raceRow(g) : gameRow(g)).join('')}</div>` : '<div id="pkActiveList"></div>'}
      ${history.length ? `<h4 style="margin:14px 0 6px">${t('pkHistory')}</h4>${history.map(g => g.mode === 'race' ? raceRow(g) : gameRow(g)).join('')}` : ''}
    </div>`;
  if (active.length) {
    state.pkTimer = setInterval(pkPoll, 5000);
  }
}
function setPkMode(m) {
  state.pkMode = m;
  document.querySelectorAll('.pk-mode-tab').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  document.getElementById('pkDuelForm').classList.toggle('hidden', m !== 'duel');
  document.getElementById('pkRaceForm').classList.toggle('hidden', m !== 'race');
}
async function pkStart(gid) {
  const r = await fetch('/api/pk/start', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin', body: JSON.stringify({game_id: gid}),
  });
  const d = await r.json();
  if (r.ok && d.test_id) openTest(d.test_id);
  else pk();
}
async function pkChallenge() {
  const msg = document.getElementById('pkMsg');
  const mode = state.pkMode || 'duel';
  let body;
  if (mode === 'race') {
    const opponents = [...document.querySelectorAll('.race-friend-cb:checked')].map(c => c.value);
    if (!opponents.length) {
      msg.className = 'auth-msg err';
      msg.textContent = t('pkPickFriends');
      return;
    }
    body = {mode, opponents,
            slug: document.getElementById('pkRaceComp').value,
            difficulty: document.getElementById('pkRaceDiff').value};
  } else {
    body = {mode: 'duel',
            opponent: document.getElementById('pkFriend').value,
            slug: document.getElementById('pkComp').value,
            difficulty: document.getElementById('pkDiff').value};
  }
  const r = await fetch('/api/pk/challenge', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin', body: JSON.stringify(body),
  });
  const d = await r.json();
  msg.className = 'auth-msg ' + (r.ok ? 'ok' : 'err');
  msg.textContent = r.ok ? t('requestSent') : (d.error || 'error');
  if (r.ok) { updateBadges(); pk(); }
}

async function pkRespond(gid, accept) {
  await fetch('/api/pk/respond', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin', body: JSON.stringify({game_id: gid, accept}),
  });
  updatePkBadge();
  pk();
}

    <tr><th>${t('clDate')}</th><th>${t('clStudent')}</th><th>${t('clTest')}</th><th>${t('clScore')}</th><th>${t('clTime')}</th></tr>
    ${reps.map(r => `<tr>
      <td>${escapeHtml(r.submitted_at || '')}</td>
      <td><b>${escapeHtml(r.student)}</b></td>

}

async function pollChat() {
  if (!state.chatWith) return;
  try {
    const r = await fetch('/api/chat/' + state.chatWith + '?since=' + (state.chatSince || 0), {credentials: 'same-origin'});
    if (!r.ok) return;
    const d = await r.json();
    const dot = document.getElementById('chatDot');
    if (dot) dot.className = 'dot' + (d.online ? ' on' : '');
    const box = document.getElementById('chatMsgs');
    if (!box) return;
    for (const m of d.messages || []) {
      state.chatSince = Math.max(state.chatSince || 0, m.ts);
      const mine = m.frm === state.user;
      box.insertAdjacentHTML('beforeend',
        `<div class="chat-row ${mine ? 'mine' : ''}"><div class="bubble">${escapeHtml(m.text)}</div></div>`);
    }
    if (d.messages && d.messages.length) box.scrollTop = box.scrollHeight;
  } catch (e) { /* transient network error; keep polling */ }
}

async function sendChat() {
  const inp = document.getElementById('chatInput');
  const text = (inp.value || '').trim();
  if (!text || !state.chatWith) return;
  inp.value = '';
  const r = await fetch('/api/chat/' + state.chatWith, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin', body: JSON.stringify({text}),
  });
  if (r.ok) {
    const d = await r.json();
    const m = d.message;
    state.chatSince = Math.max(state.chatSince || 0, m.ts);
    const box = document.getElementById('chatMsgs');
    if (box) {
      box.insertAdjacentHTML('beforeend',
        `<div class="chat-row mine"><div class="bubble">${escapeHtml(m.text)}</div></div>`);
      box.scrollTop = box.scrollHeight;
    }
  } else {
    inp.value = text;
  }
}

function sanitizeLatex(s) {
  if (!s) return s;
  s = s
    .replace(/\\begin\{(align|align\*|split|eqnarray|gather)\}/g, '\\begin{aligned}')
    .replace(/\\end\{(align|align\*|split|eqnarray|gather)\}/g, '\\end{aligned}')
    .replace(/\\label\{[^}]*\}/g, '')
    .replace(/\\tag\{[^}]*\}/g, '')
    .replace(/\\notag/g, '');
  // escape a trailing unpaired $ (odd count) so it can't swallow following text
  const dollars = s.match(/(?<!\\)\$/g);
  if (dollars && dollars.length % 2 === 1) {
    const i = s.lastIndexOf('$');
    s = s.slice(0, i) + '\\$' + s.slice(i + 1);
  }
  return s;
}

function renderMath(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, { throwOnError: false, trust: true,
      macros: {
        '\\textsc': '\\text{#1}',
        '\\overarc': '\\widehat{#1}',
        '\\ds': '',
      },
      delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false},
    ]});
  }
}
function difficulty(n, total) {
  if (total <= 6) {  // olympiad day format (IMO): P1 easy, P2-4 medium, P5-6 hard
    if (n <= 1) return ['easy', t('easy')];
    if (n <= 4) return ['mid', t('medium')];
    return ['hard', t('hard')];
  }
  const r = n / total;
  if (r <= 0.4) return ['easy', t('easy')];
  if (r <= 0.75) return ['mid', t('medium')];
  return ['hard', t('hard')];
}
function fmtTime(s) {
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function tick() {

  if (el) { el.textContent = '⏱ ' + fmtTime(left); el.classList.toggle('low', left < 300); }

function renderTest() {
  const tt = state.test;

  const qs = document.getElementById('qs');
  tt.questions.forEach(q => {
    const [cls, label] = difficulty(q.n, total);
    const div = document.createElement('div');
    div.className = 'card';
    div.id = 'q' + q.n;
    div.innerHTML = `
      <div class="qhead">

      <div class="qtext">${(LANG === 'zh' && q.question_zh) ? q.question_zh : sanitizeLatex(q.question)}</div>
      ${q.type === 'proof'
        ? `<button class="btn secondary" onclick="document.getElementById('sol${q.n}').style.display='block'; this.style.display='none'">${t('showSolution')}</button>`
        : ''}
      <div class="choices">${q.choices ? Object.entries(q.choices).map(([L, v]) => {
        const disp = (/\\[a-zA-Z]/.test(v) && !v.includes('$')) ? '$' + v + '$' : sanitizeLatex(v);
        return `
        <div class="choice" data-q="${q.n}" data-l="${L}" onclick="pick(${q.n},'${L}')">
          <span class="letter">${L}</span><span>${disp}</span>
        </div>`}).join('')
        : q.type === 'proof' ? ''
        : `<input class="int-input" id="int${q.n}" type="text" inputmode="${q.type === 'numeric' ? 'decimal' : 'numeric'}" ${q.type === 'numeric' ? '' : 'maxlength="3"'}

      </div>

}

function typed(n, v) {
  if (state.submitted) return;
  if (v.trim() === '') delete state.answers[n]; else state.answers[n] = v.trim();
  const total = state.test.questions.length;
  document.getElementById('progress').textContent =
    `${Object.keys(state.answers).length} / ${total} ${t('answered')}`;
}

function pick(n, L) {
  if (state.submitted) return;
  state.answers[n] = L;
  document.querySelectorAll(`.choice[data-q="${n}"]`).forEach(c =>
    c.classList.toggle('selected', c.dataset.l === L));
  const total = state.test.questions.length;
  document.getElementById('progress').textContent =
    `${Object.keys(state.answers).length} / ${total} ${t('answered')}`;
}

function submit() {
  if (state.submitted) return;
  state.submitted = true;
  clearInterval(state.timerId);
  stopLeaveWatch();
  let score = 0, totalPoints = 0;
  state.test.questions.forEach(q => {
    const points = q.points || 1;
    totalPoints += points;
    const card = document.getElementById('q' + q.n);
    card.classList.add('submitted');
    if (q.choices) {
      card.querySelectorAll('.choice').forEach(c => {
        if (c.dataset.l === q.answer) c.classList.add('correct');
        else if (state.answers[q.n] === c.dataset.l) c.classList.add('wrong');
      });
      if (state.answers[q.n] === q.answer) score += points;
    } else if (q.type === 'numeric') {
      const given = parseFloat(state.answers[q.n]);
      const want = parseFloat(q.answer);
      const inp = document.getElementById('int' + q.n);
      const ok = !isNaN(given) && !isNaN(want) &&
        Math.abs(given - want) <= Math.max(0.02 * Math.abs(want), 1e-9);
      inp.classList.add(ok ? 'correct' : 'wrong');
      inp.disabled = true;
      if (ok) score += points;
    } else {
      const inp = document.getElementById('int' + q.n);
      const given = (state.answers[q.n] || '').replace(/^0+(?=\d)/, '');
      const want = String(q.answer).replace(/^0+(?=\d)/, '');
      const ok = given !== '' && given === want;
      inp.classList.add(ok ? 'correct' : 'wrong');
      inp.disabled = true;
      if (ok) score += points;
    }
  });
  const total = state.test.questions.length;
  const bar = document.querySelector('.sticky-bar');
  const scoreText = totalPoints === 0
    ? t('solutionsRevealed')
    : `${t('score')}: ${score} / ${totalPoints}`;
  bar.insertAdjacentHTML('beforeend', `<span class="score">${scoreText}</span><span class="saved-note" id="savedNote">${t('saving')}</span>`);
  window.scrollTo({top: 0, behavior: 'smooth'});
  // record the attempt
  const duration_s = Math.round((Date.now() - (state.startedAt || Date.now())) / 1000);
  fetch('/api/result', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      test_id: state.test.id, title: state.test.title, competition: state.test.competition,
      score, total: totalPoints, answered: Object.keys(state.answers).length, duration_s,
    }),
  }).then(r => r.json().then(d => {
    document.getElementById('savedNote').textContent = d.guest ? t('savedGuest') : t('savedOk');
  })).catch(() => {
    document.getElementById('savedNote').textContent = t('savedFail');
  });
}

        </div>
      </div>`;
    }).join('');
  }
    if (state.tab !== _myTab || (state.test && !state.submitted)) return;  // stale async render
app.innerHTML = html;
}

async function stats() {
  const _myTab = state.tab;  // capture: render only if still current
  clearInterval(state.timerId);
  const s = await (await fetch('/api/stats')).json();
  const rows = s.per_competition.map(c => {
    const avg = c.avg_pct ?? '–';
    const best = c.best_pct ?? '–';
    const w = c.avg_pct ?? 0;
    return `<tr>
      <td>${c.competition}</td><td>${c.attempts}</td>
      <td>${avg}${c.avg_pct !== null ? '%' : ''} <span class="pct-bar"><div style="width:${w}%"></div></span></td>
      <td>${best}${c.best_pct !== null ? '%' : ''}</td>
    </tr>`;
  }).join('');
    if (state.tab !== _myTab || (state.test && !state.submitted)) return;  // stale async render
app.innerHTML = `
    <div class="card" style="display:flex;gap:32px;flex-wrap:wrap">
      <div><div class="score">${s.total_attempts}</div><div class="meta">${t('testsTaken')}</div></div>
      <div><div class="score">${s.total_questions_answered}</div><div class="meta">${t('questionsAnswered')}</div></div>
      <div><div class="score">${s.avg_pct !== null ? s.avg_pct + '%' : '–'}</div><div class="meta">${t('averageScore')}</div></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:10px">${t('byCompetition')}</h3>
      ${rows ? `<table class="stats"><tr><th>${t('competition')}</th><th>${t('attempts')}</th><th>${t('average')}</th><th>${t('best')}</th></tr>${rows}</table>` : t('noAttempts')}
    </div>`;
}

let wb;
try {
  const s = JSON.parse(localStorage.getItem('mt_wb') || 'null');
  wb = { strokes: (s && s.strokes) || [], notes: (s && s.notes) || [] };
} catch (e) { wb = { strokes: [], notes: [] }; }
wb.seq = Math.max(0, ...wb.strokes.map(s => s.id || 0), ...wb.notes.map(n => n.id || 0));
wb.z = 10; wb.tool = 'pen'; wb.color = '#1c1e21'; wb.size = 3;
wb.actions = []; wb.cat = 'arith'; wb.grp = 'MATH'; wb.cur = null; wb.ro = null;
wb.editing = null; wb.kbTab = 'vars'; wb.kbVisible = true;

function wbSave() {
  try {
    localStorage.setItem('mt_wb', JSON.stringify({
      strokes: wb.strokes,
      notes: wb.notes.map(n => ({ id: n.id, tex: n.tex, x: n.x, y: n.y })),
    }));
  } catch (e) { /* storage full: keep in memory only */ }
}

function wbSetGrp(g) {

  const first = WB_CATS.find(c => (c.grp || 'MATH') === g);
  wb.cat = first ? first.id : wb.cat;
  const s = document.getElementById('wbSearch');
  if (s) s.value = '';
  wbRenderCats();
}
function wbSetCat(id) {
  wb.cat = id;
  const s = document.getElementById('wbSearch');
  if (s) s.value = '';
  wbRenderItems();
}
function wbRenderItems() {
  const box = document.getElementById('wbItems');
  if (!box) return;
  const qEl = document.getElementById('wbSearch');
  const q = ((qEl && qEl.value) || '').trim().toLowerCase();
  box.innerHTML = '';
  const addItem = (tex, tag) => {
    const b = document.createElement('button');
    b.className = 'wb-item';
    if (tag) {
      const s = document.createElement('span');
      s.className = 'wb-tag'; s.textContent = tag;
      b.appendChild(s);
    }
    const m = document.createElement('span');
    if (window.katex) katex.render(tex, m, { throwOnError: false });
    else m.textContent = tex;
    b.appendChild(m);
    b.onclick = () => wbAddNote(tex);
    box.appendChild(b);
  };
  if (q) {
    const norm = s => s.toLowerCase().replace(/\\/g, '');
    const qq = norm(q);
    for (const c of WB_CATS) {
      const tag = LANG === 'zh' ? (c.zhShort || c.zh) : (c.enShort || c.en);
      c.items.filter(tex => norm(tex).includes(qq)).forEach(tex => addItem(tex, tag));
    }
  } else {
    const cat = WB_CATS.find(c => c.id === wb.cat);
    if (cat) cat.items.forEach(tex => addItem(tex, null));
  }
}

// --- canvas drawing ---
function wbResize() {
  const wrap = document.getElementById('wbWrap'), cv = document.getElementById('wbCanvas');
  if (!wrap || !cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  wbRedraw();
}
function wbRedraw() {
  const cv = document.getElementById('wbCanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.restore();
  wb.strokes.forEach(s => wbDrawStroke(ctx, s));
}
function wbDrawStroke(ctx, s) {
  if (s.erase) ctx.globalCompositeOperation = 'destination-out';
  ctx.strokeStyle = s.color; ctx.lineWidth = s.size;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  s.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  if (s.pts.length === 1) ctx.lineTo(s.pts[0].x + .1, s.pts[0].y);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}
function wbDown(e) {
  if (wb.editing) return;  // don't draw while the editor is open
  const cv = document.getElementById('wbCanvas');
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* synthetic events */ }
  const r = cv.getBoundingClientRect();
  const s = {
    id: ++wb.seq, erase: wb.tool === 'eraser', color: wb.color,
    size: wb.tool === 'eraser' ? wb.size * 8 : wb.size,
    pts: [{ x: e.clientX - r.left, y: e.clientY - r.top }],
  };
  wb.strokes.push(s); wb.cur = s;
  const ctx = cv.getContext('2d');
  const move = ev => {
    const p = { x: ev.clientX - r.left, y: ev.clientY - r.top };
    const last = s.pts[s.pts.length - 1];
    ctx.save();
    if (s.erase) ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = s.color; ctx.lineWidth = s.size;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.restore();
    s.pts.push(p);
  };
  const up = () => {
    cv.removeEventListener('pointermove', move);
    cv.removeEventListener('pointerup', up);
    if (s.pts.length === 1) s.pts.push({ x: s.pts[0].x + .1, y: s.pts[0].y });
    wb.actions.push({ t: 'stroke', id: s.id });
    wb.cur = null; wbSave();
  };
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', up);
  e.preventDefault();
}

// --- formula notes ---
function wbPlaceNote(w, h) {
  const wrap = document.getElementById('wbWrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const rects = wb.notes.map(n => {
    const el = document.getElementById('wbNote' + n.id);
    return el ? { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight } : null;
  }).filter(Boolean);
  for (let y = 20; y + h < H - 12; y += 26) {
    for (let x = 20; x + w < W - 12; x += 26) {
      const hit = rects.some(r => x < r.x + r.w + 10 && x + w + 10 > r.x && y < r.y + r.h + 10 && y + h + 10 > r.y);
      if (!hit) return { x, y };
    }
  }
  return { x: 30 + (wb.seq * 37) % 240, y: 30 + (wb.seq * 37) % 200 };
}
function wbAddNote(tex) {
  const note = { id: ++wb.seq, tex, x: 20, y: 20 };
  wb.notes.push(note);
  wb.actions.push({ t: 'note', id: note.id });
  wbAddNoteEl(note);
  const el = document.getElementById('wbNote' + note.id);
  if (el) {
    const p = wbPlaceNote(el.offsetWidth || 120, el.offsetHeight || 40);
    note.x = p.x; note.y = p.y;
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
  }
  wbSave();
}
function wbIsPlain(s) { return !/[\\^_{}]/.test(s); }
function wbRenderTex(el, tex) {
  el.innerHTML = '';
  if (window.katex && !wbIsPlain(tex)) {
    try { katex.render(tex, el, { throwOnError: false }); return; } catch (e) { /* fall through */ }
  }
  el.textContent = tex;  // plain text — what you type is what you get
}
function wbAddNoteEl(note) {
  const wrap = document.getElementById('wbWrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'wb-note'; el.id = 'wbNote' + note.id;
  el.style.left = note.x + 'px'; el.style.top = note.y + 'px';
  el.style.zIndex = ++wb.z;
  const body = document.createElement('span');
  body.className = 'wb-body';
  wbRenderTex(body, note.tex);
  const del = document.createElement('span');
  del.className = 'wb-del'; del.textContent = '×';
  del.onclick = ev => {
    ev.stopPropagation();
    el.remove();
    wb.notes = wb.notes.filter(n => n.id !== note.id);
    if (wb.editing === note) wbCloseEditor();
    wbSave();
  };
  const edit = document.createElement('span');
  edit.className = 'wb-edit'; edit.textContent = '✎';
  edit.onclick = ev => { ev.stopPropagation(); wbOpenEditor(note); };
  el.appendChild(body); el.appendChild(del); el.appendChild(edit);
  el.addEventListener('dblclick', e => {
    if (e.target.classList.contains('wb-del') || e.target.classList.contains('wb-edit')) return;
    wbOpenEditor(note);
  });
  el.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('wb-del') || e.target.classList.contains('wb-edit')) return;
    if (wb.editing) return;
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* synthetic events */ }
    const off = { dx: e.clientX - el.offsetLeft, dy: e.clientY - el.offsetTop };
    const move = ev => {
      let x = ev.clientX - off.dx, y = ev.clientY - off.dy;
      x = Math.max(0, Math.min(x, wrap.clientWidth - el.offsetWidth));

let leaveTimer = null, leaveCountdown = null;

function startLeaveWatch(pendingTab) {
  if (leaveTimer) return;

  warn.style.display = 'block';

  }, 1000);

// ---------- shared: expression compiler + coordinate grid ----------
function evCompile(s) {
  s = String(s || '').trim().toLowerCase().replace(/\s+/g, '').replace(/−/g, '-').replace(/×/g, '*').replace(/÷/g, '/').replace(/\^/g, '**');
  if (!s || !/^[0-9x+\-*/().]*$/.test(s)) throw new Error('bad');
  s = s.replace(/(\d)x/g, '$1*x').replace(/(\d)\(/g, '$1*(')
       .replace(/x\(/g, 'x*(').replace(/\)(?=[0-9x(])/g, ')*');
  const fn = new Function('x', 'return (' + s + ');');
  return x => { const v = fn(x); return (typeof v === 'number' && isFinite(v)) ? v : NaN; };
}
const GW_W = 920, GWH = 700;
function gwXY(x, y) { return [GW_W / 2 + x * (GW_W / 2 - 24) / 10, GWH / 2 - y * (GWH / 2 - 24) / 10]; }
function drawGrid(ctx, W, H, gridOn) {
  ctx.clearRect(0, 0, W, H);
  if (!gridOn) return;
  ctx.strokeStyle = '#e4e9f0'; ctx.lineWidth = 1;
  for (let i = -10; i <= 10; i += 2) {
    let a = gwXY(i, -10), b = gwXY(i, 10);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    a = gwXY(-10, i); b = gwXY(10, i);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  ctx.strokeStyle = '#8a94a6'; ctx.lineWidth = 1.5;
  let a = gwXY(-10, 0), b = gwXY(10, 0);
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  a = gwXY(0, -10); b = gwXY(0, 10);
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
}
function drawCurve(ctx, fn, color, dash) {
  ctx.strokeStyle = color; ctx.lineWidth = 2.2;
  if (dash) ctx.setLineDash([7, 5]);
  ctx.beginPath();
  let started = false;
  for (let px = 0; px <= GW_W; px += 2) {
    const x = -10 + 20 * px / GW_W;
    const y = fn(x);
    if (!isFinite(y) || Math.abs(y) > 14) { started = false; continue; }
    const [cx, cy] = gwXY(x, y);
    if (!started) { ctx.moveTo(cx, cy); started = true; } else ctx.lineTo(cx, cy);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

// ---------- Function Chess: enemy places points, you must fit a function ----------
let fc = null;
function fcStart() {
  fc = {round: 1, best: +(localStorage.getItem('mt_fc_best') || 0), over: false,
        pts: [], ans: '', poly: '', placing: false, msg: '', grid: true};
  fcDeal();
}
function fcPoly() {
  // hidden "nice" polynomial the enemy uses to place points
  const d = Math.min(fc.round - 1, 4);
  const coef = [];
  for (let i = 0; i <= d; i++) coef.push(Math.floor(Math.random() * 9) - 4);
  if (coef[d] === 0) coef[d] = 1 + Math.floor(Math.random() * 3);
  return coef; // coef[i] * x^i
}
function fcEvalPoly(coef, x) { return coef.reduce((s, c, i) => s + c * Math.pow(x, i), 0); }
function fcPolyStr(coef) {
  const T = ['', 'x', 'x^2', 'x^3', 'x^4'];
  let parts = [];
  for (let i = coef.length - 1; i >= 0; i--) {
    const c = coef[i];
    if (!c) continue;
    const sign = c < 0 ? '−' : '+';
    const a = Math.abs(c);
    const term = i === 0 ? String(a) : (a === 1 ? T[i] : a + T[i]);
    parts.push((parts.length ? sign : (c < 0 ? '−' : '')) + term);
  }
  return parts.join(' ') || '0';
}
function fcDeal() {
  const coef = fcPoly();
  const pts = [];
  const used = new Set();
  let guard = 0;
  while (pts.length < fc.round && guard++ < 500) {
    const x = Math.round((Math.random() * 16 - 8) * 2) / 2;
    if (used.has(x)) continue;
    const y = Math.round(fcEvalPoly(coef, x) * 2) / 2;
    if (y < -9 || y > 9) continue;
    used.add(x); pts.push({x, y, shown: false});
  }
  if (pts.length < fc.round) { fcDeal(); return; }  // retry (poly blew up)
  fc.pts = pts; fc.ans = ''; fc.poly = fcPolyStr(coef); fc.placing = true;
  fc.msg = `🎯 ${t('gFcPlacing', fc.round)}`;
  fcRender();

  let i = 0;
  const place = () => {
    if (!fc) return;
    if (i < fc.pts.length) { fc.pts[i++].shown = true; fcDraw(); setTimeout(place, 450); }
    else { fc.placing = false; fc.msg = t('gFcYourMove'); fcRender(); }

// ---------- Graph War: fire from your point N to the enemy's point N ----------
let gw = null;
function gwStart() {
  const yours = [], enemys = [];
  const used = new Set();
  const mk = (arr) => {
    let guard = 0;
    while (arr.length < 5 && guard++ < 500) {
      const x = Math.round((Math.random() * 16 - 8) * 2) / 2;
      const y = Math.round((Math.random() * 16 - 8) * 2) / 2;
      const k = x + ',' + y;
      if (used.has(k)) continue;
      used.add(k);
      arr.push({x, y, hit: false});
    }
  };
  mk(yours); mk(enemys);
  // every round needs a well-defined line: the two points must differ in x
  for (let i = 0; i < 5; i++) {
    if (yours[i].x === enemys[i].x) {
      for (let j = 0; j < 5; j++) {
        if (yours[i].x !== enemys[j].x && yours[j].x !== enemys[i].x) {
          [enemys[i], enemys[j]] = [enemys[j], enemys[i]];
          break;
        }
      }
    }
  }

  gwRender();
}

  const cv = document.getElementById('gwCanvas');
  if (!cv || !gw) return;
  const ctx = cv.getContext('2d');
  drawGrid(ctx, GW_W, GWH, gw.grid !== false);
  if (gw.ans) { try { drawCurve(ctx, evCompile(gw.ans), 'rgba(43,111,227,.8)'); } catch (e) {} }
  for (let i = 1; i <= 5; i++) {
    for (const side of ['you', 'ai']) {
      const p = gwPt(side, i);
      if (p.hit) continue;
      const isNow = i === gw.round && !gw.over;
      const [x, y] = gwXY(p.x, p.y);
      ctx.globalAlpha = isNow ? 1 : .45;
      ctx.fillStyle = side === 'you' ? '#2b6fe3' : '#d3453d';
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, isNow ? 12 : 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `bold ${isNow ? 13 : 10}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(i), x, y + .5);
      ctx.globalAlpha = 1;
    }
  }
}
function gwRender() {
  const r = Math.min(gw.round, 5);
  app.innerHTML = `
  <div class="card">
    <div class="fr-req" style="border-top:none">
      <h3>${t('gGraph')}</h3>
      <button class="btn sm ghost" onclick="gamesView()">${t('gBack')}</button>
    </div>
    <div style="font-size:14.5px;margin-bottom:8px">
      ${t('gGwRound', r)} · <b style="color:#2b6fe3">${t('gYou')}: ${gw.you}</b> · <b style="color:#d3453d">${t('gAI')}: ${gw.ai}</b>
    </div>
    <div class="gw-wrap">
      <div class="gw-canvas-box"><canvas id="gwCanvas" width="${GW_W}" height="${GWH}" style="max-width:100%"></canvas></div>
      <div class="gw-ctl">
        <div class="auth-msg ${gw.msg.startsWith('⚠') || gw.over && gw.ai > gw.you ? 'err' : 'ok'}" style="min-height:20px;margin-bottom:8px">${gw.msg}</div>
        <div style="font-size:13.5px;color:#555;margin-bottom:6px">${t('gGwTask')}</div>
        <label>f(x) =</label>
        <input type="text" id="gwAns" placeholder="e.g. 0.5x + 3" value="${escapeHtml(gw.ans)}"
               style="width:100%;font-size:16px;padding:9px 10px;border:1.5px solid #c9d4e4;border-radius:8px;font-family:ui-monospace,Menlo,monospace"
               ${gw.over || gw.firing ? 'disabled' : ''} oninput="gw.ans=this.value;gwDraw()">
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" ${gw.over || gw.firing ? 'disabled' : ''} onclick="gwFire()">${t('gFire')}</button>
          <button class="btn sm ghost" onclick="gw.grid = gw.grid === false; gwRender()">▦ ${t('gGrid')}</button>
          <button class="btn sm ghost" onclick="gwStart()">↺ ${t('gPlay')}</button>
        </div>
      </div>
    </div>
  </div>`;
  gwDraw();
}
function gwFire() {
  if (!gw || gw.over || gw.firing) return;
  const r = Math.min(gw.round, 5);
  let fn;
  try { fn = evCompile(document.getElementById('gwAns').value); }
  catch (e) { gw.msg = '⚠ ' + t('gFcBadExpr'); gwRender(); return; }
  const a = gwPt('you', r), b = gwPt('ai', r);
  const ok = Math.abs(fn(a.x) - a.y) <= 0.26 && Math.abs(fn(b.x) - b.y) <= 0.26;
  gw.firing = true;
  if (ok) { b.hit = true; gw.you += 100; gw.msg = `🎯 ${t('gGwHit', r)}`; }
  else gw.msg = `💨 ${t('gGwMiss', r)}`;
  gwRender();
  setTimeout(() => {
    if (!gw) return;
    // AI takes its shot at your point #r with ~65% accuracy
    if (Math.random() < 0.65) { a.hit = true; gw.ai += 100; gw.msg += ` · 🤖 🎯+100`; }
    else gw.msg += ' · 🤖 💨';
    gw.round++;
    gw.firing = false;
    if (gw.round > 5 || gwEnd()) { gwRender(); return; }
    gw.msg += ` — ${t('gGwNext', gw.round)}`;
    gw.ans = '';
    gwRender();
  }, 900);
}
function gwEnd() {
  if (gw.round > 5) {
    gw.over = true;
    gw.msg = (gw.you > gw.ai ? t('gYouWin') : gw.ai > gw.you ? t('gAiWin') : t('gRoundTie')) + `  (${gw.you} : ${gw.ai})`;
    return true;
  }
  return false;
}
</script>
</body>
</html>
